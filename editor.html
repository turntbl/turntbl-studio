<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Turntbl Studio</title>
  <link rel="stylesheet" href="css/editor.css">
</head>
<body>
  
  <!-- State: CAMERA_READY -->
  <section id="camera-view" class="view active">
    <!-- Top Bar -->
    <div class="top-bar">
      <button id="cancel-btn" class="icon-btn">✕</button>
      <button id="flash-btn" class="icon-btn">⚡</button>
    </div>

    <!-- Camera Feed -->
    <video id="camera-preview" autoplay muted playsinline></video>

    <!-- Countdown Overlay (hidden by default) -->
    <div id="countdown-overlay" class="countdown-overlay">
      <div id="countdown-number" class="countdown-number">3</div>
    </div>

    <!-- Recording Indicator (hidden by default) -->
    <div id="recording-indicator" class="recording-indicator">
      <span class="rec-dot"></span>
      <span id="recording-timer">0:00</span>
    </div>

    <!-- Bottom Controls -->
    <div class="bottom-controls">
      <!-- Tool Icons -->
      <div class="tool-icons">
        <button id="upload-btn" class="tool-btn">
          <span class="tool-icon">📁</span>
          <span class="tool-label">Upload</span>
        </button>
        <button id="effects-btn" class="tool-btn disabled">
          <span class="tool-icon">✨</span>
          <span class="tool-label">Effects</span>
        </button>
        <button id="timer-btn" class="tool-btn disabled">
          <span class="tool-icon">⏱️</span>
          <span class="tool-label">Timer</span>
        </button>
      </div>

      <!-- Record Button -->
      <button id="record-btn" class="record-btn">
        <div class="record-inner"></div>
      </button>

      <!-- Flip Camera Button -->
      <button id="flip-camera-btn" class="flip-btn">🔄</button>
    </div>

    <!-- Hidden file input -->
    <input type="file" id="video-upload-input" accept="video/*" hidden>
  </section>

  <!-- State: POST_RECORD_REVIEW -->
  <section id="review-view" class="view">
    <!-- Top Bar -->
    <div class="top-bar">
      <button id="review-cancel-btn" class="icon-btn">✕</button>
      <span id="review-duration" class="duration-display">0:00</span>
    </div>

    <!-- Video Preview -->
    <video id="review-video" playsinline loop></video>

    <!-- Scrubber -->
    <div class="scrubber-container">
      <input type="range" id="review-scrubber" class="scrubber" min="0" max="100" value="0">
      <div class="scrubber-times">
        <span id="scrubber-start">0:00</span>
        <span id="scrubber-end">0:00</span>
      </div>
    </div>

    <!-- Action Buttons -->
    <div class="review-actions">
      <button id="retake-btn" class="action-btn secondary">
        ← Retake
      </button>
      <button id="continue-btn" class="action-btn primary">
        Continue →
      </button>
    </div>
  </section>

  <!-- State: EDIT_MODE -->
  <section id="edit-view" class="view">
    <!-- Top Bar -->
    <div class="top-bar">
      <button id="edit-cancel-btn" class="icon-btn">✕</button>
      <span class="view-title">Edit Video</span>
    </div>
  
    <!-- Video Preview -->
    <div class="video-preview-section">
      <video id="edit-video" playsinline loop muted></video>
      <audio id="preview-audio" loop style="display: none;"></audio>
    </div>
  
    <!-- Video Timeline with Thumbnails -->
    <div class="timeline-section">
      <div class="timeline-label">
        <span id="trim-duration">0:00</span>
        <span class="timeline-instruction">Drag to trim (max 30s)</span>
      </div>
      
      <div class="video-timeline-container">
        <div id="video-thumbnails" class="video-thumbnails"></div>
        
        <!-- Dark overlays on TRIMMED parts -->
        <div id="trim-overlay-left" class="trim-overlay left"></div>
        <div id="trim-overlay-right" class="trim-overlay right"></div>
        
        <!-- Selection borders -->
        <div id="trim-selection" class="trim-selection">
          <div id="trim-handle-left" class="trim-handle left">
            <div class="handle-line"></div>
          </div>
          <div id="trim-handle-right" class="trim-handle right">
            <div class="handle-line"></div>
          </div>
        </div>
      </div>
      
      <div class="timeline-times">
        <span id="timeline-start">0:00</span>
        <span id="timeline-end">0:00</span>
      </div>
    </div>
  
    <!-- Music Card -->
    <div class="music-card-section">
      <button id="music-card" class="music-card">
        <div class="music-card-content">
          <div id="music-icon" class="music-icon">🎵</div>
          <div id="music-info" class="music-info">
            <p class="music-title">Add Sound</p>
            <p class="music-artist">Choose from your songs</p>
          </div>
        </div>
        <div class="music-arrow">›</div>
      </button>
  
      <!-- Song Timeline (hidden until song selected) -->
      <div id="song-timeline-section" class="song-timeline-section" style="display: none;">
        <div class="timeline-label">
          <span class="timeline-instruction">Select which part of the song to use</span>
        </div>
        
        <div class="song-timeline-container">
          <div id="song-waveform" class="song-waveform"></div>
          <div class="song-timeline-overlay">
            <div id="song-selection" class="song-selection">
              <div id="song-handle-left" class="song-handle left">
                <div class="handle-line"></div>
              </div>
              <div id="song-handle-right" class="song-handle right">
                <div class="handle-line"></div>
              </div>
            </div>
          </div>
        </div>
        
        <div class="timeline-times">
          <span id="song-start-time">0:00</span>
          <span id="song-duration">0:00 selected</span>
          <span id="song-end-time">0:00</span>
        </div>
      </div>
    </div>
  
    <!-- Next Button -->
    <div class="edit-actions">
      <button id="next-to-finalize-btn" class="btn-next">
        Next
      </button>
    </div>
  
    <!-- Music Drawer -->
    <div id="music-drawer" class="music-drawer">
      <div class="drawer-header">
        <h3>Add Sound</h3>
        <button id="close-music-drawer" class="icon-btn">✕</button>
      </div>
      
      <div class="drawer-body">
        <!-- Your Songs -->
        <div class="music-section">
          <h4>Your Songs</h4>
          <div id="your-songs-list" class="songs-list">
            <div class="loading">Loading...</div>
          </div>
        </div>
  
        <!-- Original Audio -->
        <div class="music-section">
          <h4>Original Audio</h4>
          <button id="use-original-audio" class="option-btn">
            🔇 Use Video's Original Audio
          </button>
        </div>
      </div>
    </div>
  </section>

  <!-- State: SAVING -->
  <section id="saving-view" class="view">
    <div class="saving-container">
      <div class="spinner-large"></div>
      <h2>Saving Your Video...</h2>
      <p id="save-status">Uploading...</p>
      <div class="progress-bar">
        <div id="progress-fill" class="progress-fill"></div>
      </div>
    </div>
  </section>

  <!-- Tooltip for disabled buttons -->
  <div id="tooltip" class="tooltip">Coming Soon!</div>

  <script type="module" src="js/editor.js"></script>
</body>
</html>
