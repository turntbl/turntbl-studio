<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Turntbl Studio</title>
  <link rel="stylesheet" href="css/editor.css">
</head>
<body>
  
  <!-- State: CAMERA_READY -->
  <section id="camera-view" class="view active">
    <!-- Top Bar -->
    <div class="top-bar">
      <button id="cancel-btn" class="icon-btn">✕</button>
      <button id="flash-btn" class="icon-btn">⚡</button>
    </div>

    <!-- Camera Feed -->
    <video id="camera-preview" autoplay muted playsinline></video>

    <!-- Countdown Overlay (hidden by default) -->
    <div id="countdown-overlay" class="countdown-overlay">
      <div id="countdown-number" class="countdown-number">3</div>
    </div>

    <!-- Recording Indicator (hidden by default) -->
    <div id="recording-indicator" class="recording-indicator">
      <span class="rec-dot"></span>
      <span id="recording-timer">0:00</span>
    </div>

    <!-- Bottom Controls -->
    <div class="bottom-controls">
      <!-- Tool Icons -->
      <div class="tool-icons">
        <button id="upload-btn" class="tool-btn">
          <span class="tool-icon">📁</span>
          <span class="tool-label">Upload</span>
        </button>
        <button id="effects-btn" class="tool-btn disabled">
          <span class="tool-icon">✨</span>
          <span class="tool-label">Effects</span>
        </button>
        <button id="timer-btn" class="tool-btn disabled">
          <span class="tool-icon">⏱️</span>
          <span class="tool-label">Timer</span>
        </button>
      </div>

      <!-- Record Button -->
      <button id="record-btn" class="record-btn">
        <div class="record-inner"></div>
      </button>

      <!-- Flip Camera Button -->
      <button id="flip-camera-btn" class="flip-btn">🔄</button>
    </div>

    <!-- Hidden file input -->
    <input type="file" id="video-upload-input" accept="video/*" hidden>
  </section>

  <!-- State: POST_RECORD_REVIEW -->
  <section id="review-view" class="view">
    <!-- Top Bar -->
    <div class="top-bar">
      <button id="review-cancel-btn" class="icon-btn">✕</button>
      <span id="review-duration" class="duration-display">0:00</span>
    </div>

    <!-- Video Preview -->
    <video id="review-video" playsinline loop></video>

    <!-- Scrubber -->
    <div class="scrubber-container">
      <input type="range" id="review-scrubber" class="scrubber" min="0" max="100" value="0">
      <div class="scrubber-times">
        <span id="scrubber-start">0:00</span>
        <span id="scrubber-end">0:00</span>
      </div>
    </div>

    <!-- Action Buttons -->
    <div class="review-actions">
      <button id="retake-btn" class="action-btn secondary">
        ← Retake
      </button>
      <button id="continue-btn" class="action-btn primary">
        Continue →
      </button>
    </div>
  </section>

  <!-- State: EDIT_MODE -->
  <section id="edit-view" class="view">
    <!-- Top Bar -->
    <div class="top-bar">
      <button id="edit-cancel-btn" class="icon-btn">✕</button>
      <span id="edit-duration" class="duration-display">0:00</span>
      <button id="next-btn" class="next-btn">Next</button>
    </div>

    <!-- Video Preview with Text Overlays -->
    <div class="video-container">
      <canvas id="video-canvas"></canvas>
      <div id="text-overlay-container" class="text-overlay-container"></div>
      <video id="edit-video" playsinline loop style="display: none;"></video>
    </div>

    <!-- Video Controls -->
    <div class="video-controls">
      <button id="play-pause-btn" class="control-btn">▶️</button>
      <input type="range" id="edit-scrubber" class="scrubber" min="0" max="100" value="0">
      <span id="edit-time">0:00 / 0:00</span>
    </div>

    <!-- Tool Tabs -->
    <div class="tool-tabs">
      <button class="tool-tab" data-tool="music">
        <span class="tab-icon">🎵</span>
        <span class="tab-label">Sounds</span>
      </button>
      <button class="tool-tab" data-tool="text">
        <span class="tab-icon">💬</span>
        <span class="tab-label">Text</span>
      </button>
      <button class="tool-tab" data-tool="trim">
        <span class="tab-icon">✂️</span>
        <span class="tab-label">Trim</span>
      </button>
    </div>

    <!-- Tool Drawers -->
    <div id="tool-drawer" class="tool-drawer">
      
      <!-- Music Drawer -->
      <div id="music-drawer" class="drawer-content">
        <div class="drawer-header">
          <h3>🎵 Add Sound</h3>
          <button class="close-drawer-btn">✕</button>
        </div>
        
        <div class="drawer-body">
          <!-- Your Songs -->
          <div class="music-section">
            <h4>Your Songs</h4>
            <div id="your-songs-list" class="songs-list">
              <div class="loading">Loading...</div>
            </div>
          </div>

          <!-- Upload New Audio -->
          <div class="music-section">
            <h4>Upload New Audio</h4>
            <label for="audio-upload-input" class="upload-audio-btn">
              Choose Audio File
            </label>
            <input type="file" id="audio-upload-input" accept="audio/*" hidden>
            <div id="audio-preview" class="audio-preview" style="display: none;">
              <audio id="audio-element" controls></audio>
              <p id="audio-filename"></p>
            </div>
          </div>

          <!-- Original Audio -->
          <div class="music-section">
            <h4>Original Audio</h4>
            <button id="original-audio-btn" class="option-btn">
              🔇 Use Original Audio
            </button>
          </div>
        </div>
      </div>

      <!-- Text Drawer -->
      <div id="text-drawer" class="drawer-content">
        <div class="drawer-header">
          <h3>💬 Add Text</h3>
          <button class="close-drawer-btn">✕</button>
        </div>
        
        <div class="drawer-body">
          <input type="text" id="text-input" class="text-input" placeholder="Type text here..." maxlength="100">
          
          <div class="text-controls">
            <div class="control-group">
              <label>Font</label>
              <select id="text-font" class="text-select">
                <option value="Arial">Arial</option>
                <option value="Impact">Impact</option>
                <option value="Georgia">Georgia</option>
                <option value="Courier New">Courier</option>
                <option value="Comic Sans MS">Comic Sans</option>
              </select>
            </div>
            
            <div class="control-group">
              <label>Size</label>
              <input type="number" id="text-size" class="text-number" min="20" max="100" value="48">
            </div>
            
            <div class="control-group">
              <label>Color</label>
              <input type="color" id="text-color" class="text-color" value="#ffffff">
            </div>
          </div>

          <button id="add-text-btn" class="action-btn primary">Add Text</button>

          <div id="text-list" class="text-list"></div>
        </div>
      </div>

      <!-- Trim Drawer -->
      <div id="trim-drawer" class="drawer-content">
        <div class="drawer-header">
          <h3>✂️ Trim Video</h3>
          <button class="close-drawer-btn">✕</button>
        </div>
        
        <div class="drawer-body">
          <p class="trim-info">Maximum 30 seconds</p>
          
          <div class="trim-controls">
            <div class="control-group">
              <label>Start</label>
              <input type="number" id="trim-start" class="trim-input" min="0" step="0.1" value="0">
              <span class="unit">sec</span>
            </div>
            
            <div class="control-group">
              <label>End</label>
              <input type="number" id="trim-end" class="trim-input" min="0" step="0.1" value="30">
              <span class="unit">sec</span>
            </div>
          </div>

          <button id="apply-trim-btn" class="action-btn primary">Apply Trim</button>
          
          <div id="trim-status" class="trim-status"></div>
        </div>
      </div>

    </div>
  </section>

  <!-- State: SAVING -->
  <section id="saving-view" class="view">
    <div class="saving-container">
      <div class="spinner-large"></div>
      <h2>Saving Your Video...</h2>
      <p id="save-status">Uploading...</p>
      <div class="progress-bar">
        <div id="progress-fill" class="progress-fill"></div>
      </div>
    </div>
  </section>

  <!-- Tooltip for disabled buttons -->
  <div id="tooltip" class="tooltip">Coming Soon!</div>

  <script type="module" src="js/editor.js"></script>
</body>
</html>
